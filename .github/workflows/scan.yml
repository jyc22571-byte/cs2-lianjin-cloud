name: 每日炼金扫描

on:
  schedule:
    # 北京时间 00:05 = UTC 16:05（Actions cron 用 UTC）
    - cron: '5 16 * * *'
  workflow_dispatch:   # 仓库 Actions 页可手动触发

permissions:
  contents: write   # 需要把 净EV榜.json 提交回仓库

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行云端扫描（约 50-60 分钟）
        env:
          STEAMDT_API_KEY: ${{ secrets.STEAMDT_API_KEY }}
        run: python 云端扫描.py

      - name: 提交结果回仓库
        run: |
          git config user.name "dsh-scan-bot"
          git config user.email "dsh-scan-bot@users.noreply.github.com"
          git add 净EV榜.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "每日扫描 $(date -u +'%Y-%m-%d') 净EV榜"
            git push
          fi
